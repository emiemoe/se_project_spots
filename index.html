<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="spots project for tripleten" />
    <meta name="author" content="Emie Moe" />
    <meta name="keywords" content="HTML, CSS, coding, bootcamp" />
    <link rel="stylesheet" href="./pages/index.css" />
    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <title>See Spot Run</title>
  </head>
  <body>
    <div class="page">
      <header class="header">
        <img src="./images/Logo.svg" alt="Spots Logo" class="header__logo" />
      </header>
      <main class="content">
        <section class="profile page__section">
          <img
            src="./images/avatar.jpg"
            alt="Bessie Coleman"
            class="profile__picture"
          />
          <div class="profile__content">
            <h1 class="profile__name">Bessie Coleman</h1>
            <p class="profile__description">Civil Aviator</p>
            <button class="profile__edit-button" type="button">
              <img
                alt="pencil image"
                class="profile__pencil"
                src="./images/EditIcon.svg"
              />Edit Profile
            </button>
          </div>
          <button class="profile__new-button" type="button">
            <img
              alt="plus icon"
              src="./images/Plusicon.svg"
              class="profile__plus-icon"
            />
            New Post
          </button>
        </section>
        <section class="cards page__section">
          <ul class="cards__list">
            <template id="card-template">
              <li class="card">
                <button class="card__delete-button" type="button"></button>
                <img class="card__image" src="#" alt="" />
                <div class="card__content">
                  <h2 class="card__title"></h2>
                  <button
                    aria-label="Like card"
                    class="card__heart-button"
                    type="button"
                  ></button>
                </div>
              </li>
            </template>
          </ul>
        </section>
      </main>
      <footer class="footer">
        <p class="footer__label">2025 &copy; Spots</p>
      </footer>
      <div class="modal" id="edit-profile-modal">
        <div class="modal__container">
          <div class="modal__row">
            <h2 class="modal__title">Edit profile</h2>
            <button type="button" class="modal__close-button"></button>
          </div>
          <form class="modal__form">
            <label for="profile-name-input" class="modal__label"
              >Name
              <input
                type="text"
                id="profile-name-input"
                class="modal__input"
                placeholder="Type your name"
                required
              />
            </label>
            <label for="profile-description-input" class="modal__label"
              >Description
              <input
                type="text"
                id="profile-description-input"
                class="modal__input"
                placeholder="Describe yourself"
                required
            /></label>
            <button type="submit" class="modal__save-button">Save</button>
          </form>
        </div>
      </div>
      <div class="modal" id="new-post-modal">
        <div class="modal__container">
          <div class="modal__row">
            <h2 class="modal__title">New post</h2>
            <button type="button" class="modal__close-button"></button>
          </div>
          <form class="modal__form">
            <label for="image-link" class="modal__label"
              >Image link
              <input
                type="url"
                id="image-link"
                class="modal__input"
                placeholder="Paste a link to a picture"
                required
            /></label>
            <label for="caption-label" class="modal__label"
              >Caption
              <input
                type="text"
                id="caption-label"
                class="modal__input"
                placeholder="Type your caption"
                required
            /></label>
            <button type="submit" class="modal__save-button">Save</button>
          </form>
        </div>
      </div>
      <div class="modal modal-type-preview" id="preview-modal">
        <div class="modal__image-container">
          <button
            aria-label="Close modal"
            type="button"
            class="modal__close-button modal__close-button-preview"
          ></button>
          <img src="#" alt="" class="modal__image" />
          <h3 class="modal__caption"></h3>
        </div>
      </div>
    </div>
    <script src="./scripts/index.js"></script>
  </body>
</html>
